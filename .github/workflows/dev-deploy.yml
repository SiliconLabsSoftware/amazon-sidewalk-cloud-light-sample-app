name: Dev deploy

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  
env:
  SECRETS_CONFIG: |
    [
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "TERRAFORM_BACKEND_BUCKET",
        "variable": "TERRAFORM_BACKEND_BUCKET"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "FRONTEND_PASSWORD",
        "variable": "FRONTEND_PASSWORD"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "AWS_ACCESS_KEY_ID",
        "variable": "AWS_ACCESS_KEY_ID"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "AWS_SECRET_ACCESS_KEY",
        "variable": "AWS_SECRET_ACCESS_KEY"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_FRONTEND_PUBLIC_URL",
        "variable": "DEV_APP_FRONTEND_PUBLIC_URL"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_IOT_ENDPOINT",
        "variable": "DEV_APP_IOT_ENDPOINT"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_REST_URL",
        "variable": "DEV_APP_REST_URL"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_WSS_URL",
        "variable": "DEV_APP_WSS_URL"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_FRONTEND_S3_BUCKET",
        "variable": "DEV_APP_FRONTEND_S3_BUCKET"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_CLOUDFRONT_ID",
        "variable": "DEV_APP_CLOUDFRONT_ID"
      },
      {
        "secret": "teams/data/wireless-tools/app/sidewalk-cloud-light",
        "key": "DEV_APP_AWS_ACCOUNT_ID",
        "variable": "DEV_APP_AWS_ACCOUNT_ID"
      }
    ]

jobs:
  deploy:
    runs-on: silabs-internal
    environment: dev

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Vault secrets
        uses: SiliconLabsInternal/wireless-tools-workflows/.github/actions/vault@main
        with:
          ca-cert: ${{ vars.SILABS_VAULT_PROD_CA }}
          secret-config: "${{ env.SECRETS_CONFIG }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${{ env.TERRAFORM_BACKEND_BUCKET }}"
          echo "::add-mask::${{ env.FRONTEND_PASSWORD }}"
          echo "::add-mask::${{ env.AWS_ACCESS_KEY_ID }}"
          echo "::add-mask::${{ env.AWS_SECRET_ACCESS_KEY }}"
          echo "::add-mask::${{ env.DEV_APP_FRONTEND_PUBLIC_URL }}"
          echo "::add-mask::${{ env.DEV_APP_IOT_ENDPOINT }}"
          echo "::add-mask::${{ env.DEV_APP_REST_URL }}"
          echo "::add-mask::${{ env.DEV_APP_WSS_URL }}"
          echo "::add-mask::${{ env.DEV_APP_FRONTEND_S3_BUCKET }}"
          echo "::add-mask::${{ env.DEV_APP_CLOUDFRONT_ID }}"
          echo "::add-mask::${{ env.DEV_APP_AWS_ACCOUNT_ID }}"

      - name: Build deployer image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "cloud-light:dev-${{ github.sha }}" .

      - name: Deploy (run container)
        shell: bash
        env:
          AWS_REGION: us-east-1
          TERRAFORM_BACKEND_BUCKET: ${{ env.TERRAFORM_BACKEND_BUCKET }}
          FRONTEND_PASSWORD: ${{ env.FRONTEND_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/cloud-light" \
            -e AWS_REGION=$AWS_REGION \
            -e TERRAFORM_BACKEND_BUCKET=$TERRAFORM_BACKEND_BUCKET \
            -e FRONTEND_PASSWORD=$FRONTEND_PASSWORD \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            "cloud-light:dev-${{ github.sha }}" \
            deploy
