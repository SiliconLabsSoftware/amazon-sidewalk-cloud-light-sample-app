sonar.projectKey=sidewalk-cloud-light
sonar.projectName=Sidewalk Cloud Light
sonar.sourceEncoding=UTF-8

sonar.modules=device,terraform,frontend,lambda

# Device — plain JavaScript (Node scripts)
device.sonar.projectName=Device
device.sonar.sources=.
device.sonar.exclusions=node_modules/**,certs/**,package-lock.json
device.sonar.tests=
device.sonar.language=js

# Terraform — HCL (IaC analyzer)
terraform.sonar.projectName=Terraform
terraform.sonar.sources=.
terraform.sonar.exclusions=.terraform/**,.outputs.sh,.vscode/**
terraform.sonar.language=terraform

# Frontend — TypeScript + Vue
frontend.sonar.projectName=Frontend
frontend.sonar.sources=src
frontend.sonar.exclusions=node_modules/**,dist/**,coverage/**
frontend.sonar.tests=
frontend.sonar.typescript.tsconfigPaths=tsconfig.app.json

# Lambda — TypeScript
lambda.sonar.projectName=Lambda
lambda.sonar.sources=src
lambda.sonar.exclusions=node_modules/**,dist/**,coverage/**
lambda.sonar.tests=src
lambda.sonar.test.inclusions=**/*.test.ts
lambda.sonar.typescript.tsconfigPaths=tsconfig.json
